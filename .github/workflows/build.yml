name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 21 compiles the 1.21.1 mod (Gradle toolchain), 25 runs Gradle itself
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v6

      # api, common, fabric, neoforge + JUnit + GameTests on both loaders (headless)
      - name: Build
        run: ./gradlew build --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: tradery-jars
          path: |
            fabric/build/libs/tradery-fabric-*.jar
            neoforge/build/libs/tradery-neoforge-*.jar
            api/build/libs/tradery-api-*.jar
          if-no-files-found: error
