modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/eliasnvx/Tradery/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://github.com/eliasnvx/Tradery"
logoFile = "assets/tradery/icon.png"
authors = "${mod_author}"
description = '''${description}'''

# Mixins: Forge 47 has no [[mixins]] block; the configs are listed in the jar manifest (forge/build.gradle)

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
