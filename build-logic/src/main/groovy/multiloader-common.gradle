// Shared by every module: Java toolchain, jar metadata, resource templating, JUnit.
plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'Nucleoid'; url = 'https://maven.nucleoid.xyz/' } }
        filter { includeGroup 'eu.pb4' }
    }
    exclusiveContent {
        forRepository { maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' } }
        filter { includeGroup 'mezz.jei'; includeGroupAndSubgroups 'net.mezzdev' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' } }
        filter { includeGroup 'me.shedaniel'; includeGroup 'me.shedaniel.cloth'; includeGroup 'dev.architectury' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

// Optional integrations: plugin classes live in :common and are only loaded by the mods they plug into. Every module
// compiles :common's sources, so each declares the same compile-only APIs, remapped to Mojang names by its own
// toolchain (Loom: the Fabric jars, legacyforge: the SRG Forge jars); see common/build.gradle.

dependencies {
    compileOnly "org.jetbrains:annotations:${jetbrains_annotations_version}"
    testCompileOnly "org.jetbrains:annotations:${jetbrains_annotations_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
    options.compilerArgs << '-Xlint:deprecation'
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_api_version'           : fabric_api_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description ?: rootProject.property('description'),
            'forge_version'                : forge_version,
            'forge_loader_version_range'   : forge_loader_version_range,
            'java_version'                 : java_version,
            'api_version'                  : api_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json', 'tradery-build.properties']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}
