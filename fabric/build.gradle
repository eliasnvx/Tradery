plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Common Economy API: Tradery registers as a provider; shipped inside the jar (it's tiny, and other mods need it)
    implementation include("eu.pb4:common-economy-api:${common_economy_api_version}")
    // Text Placeholder API: optional (%tradery:balance% etc.)
    compileOnly("eu.pb4:placeholder-api:${placeholder_api_version}") { transitive = false }

    // Dev only: run with the optional mods installed: ./gradlew :fabric:runClient -Pcompat=true, or some of them:
    // -Pcompat=recipes,jade,placeholders,wthit,maps (or bluemap, squaremap),villages (Jade and WTHIT both draw a tooltip: pick one for screenshots)
    def compat = project.findProperty('compat')?.toString()
    if (compat != null) {
        def wanted = { String group -> compat == 'true' || compat.split(',')*.trim().contains(group) }
        if (wanted('recipes')) {
            runtimeOnly("mezz.jei:jei-26.3-fabric:${jei_version}")
            runtimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")
            runtimeOnly("dev.architectury:architectury-fabric:${architectury_version}")
            runtimeOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}")
        }
        if (wanted('jade')) {
            runtimeOnly("maven.modrinth:jade:${jade_fabric_version}")
        }
        if (wanted('placeholders')) {
            runtimeOnly("eu.pb4:placeholder-api:${placeholder_api_version}")
        }
        if (wanted('wthit')) {
            // WTHIT 21 needs Fabric API 0.165.2+ at runtime: add -Pfabric_api_version=0.166.2+26.3
            runtimeOnly("maven.modrinth:wthit:fabric-${wthit_version}")
            runtimeOnly("maven.modrinth:badpackets:fabric-${badpackets_version}")
        }
        // `maps` = both; BlueMap and squaremap don't load together on NeoForge 1.21.1 (both bring Adventure's gson serializer)
        if (wanted('maps') || wanted('bluemap')) {
            runtimeOnly("maven.modrinth:bluemap:${bluemap_version}-fabric")
        }
        if (wanted('maps') || wanted('squaremap')) {
            runtimeOnly("maven.modrinth:squaremap:${squaremap_fabric_id}")
        }
        if (wanted('villages')) {
            runtimeOnly("maven.modrinth:villagersplus:${villagersplus_version}-fabric")
            runtimeOnly("maven.modrinth:villagerstradingplus:${villagerstradingplus_version}-fabric")
            // CTOV on Fabric reads its config through Cloth Config (AutoConfig)
            runtimeOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}")
            runtimeOnly("maven.modrinth:ct-overhaul-village:${ctov_fabric_version}") { transitive = false }
            runtimeOnly("maven.modrinth:lithostitched:${lithostitched_version}-fabric-26.3")
        }
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// GameTests: shared bodies in common (dev.eliasnvx.tradery.gametest), @GameTest wrappers in src/gametest.
// runGameTest is part of `build`. Client GameTests open a real window and run by hand:
//   ./gradlew :fabric:runClientGameTest   (screenshots in fabric/build/run/clientGameTest/screenshots)
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'tradery-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true // dev/CI test server only (as in the author's other mods)
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

apply from: rootProject.file('gradle/publish-mod.gradle')
