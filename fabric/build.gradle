plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Common Economy API: Tradery registers as a provider; shipped inside the jar (it's tiny, and other mods need it)
    implementation include("eu.pb4:common-economy-api:${common_economy_api_version}")
    // Text Placeholder API: optional (%tradery:balance% etc.)
    compileOnly("eu.pb4:placeholder-api:${placeholder_api_version}") { transitive = false }

    // Dev only: run with the optional mods installed: ./gradlew :fabric:runClient -Pcompat=true
    if (project.hasProperty('compat')) {
        runtimeOnly("mezz.jei:jei-26.3-fabric:${jei_version}")
        runtimeOnly("maven.modrinth:jade:${jade_fabric_version}")
        runtimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")
        runtimeOnly("dev.architectury:architectury-fabric:${architectury_version}")
        runtimeOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}")
        runtimeOnly("eu.pb4:placeholder-api:${placeholder_api_version}")
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// GameTests: shared bodies in common (dev.eliasnvx.tradery.gametest), @GameTest wrappers in src/gametest.
// runGameTest is part of `build`. Client GameTests open a real window and run by hand:
//   ./gradlew :fabric:runClientGameTest   (screenshots in fabric/build/run/clientGameTest/screenshots)
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'tradery-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true // dev/CI test server only (as in the author's other mods)
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
