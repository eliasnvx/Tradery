plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Common Economy API: Tradery registers as a provider; shipped inside the jar (it's tiny, and other mods need it)
    modImplementation include("eu.pb4:common-economy-api:${common_economy_api_version}") { transitive = false }
    // Permission nodes (LuckPerms & co.): Fabric API 1.21.1 has no permission module; tiny, shipped inside the jar.
    // 0.3.1 is the last build for 1.21.1 (0.3.2+ call 1.21.2 methods); not transitive, its BOM would bump Fabric API modules
    modImplementation include("me.lucko:fabric-permissions-api:${fabric_permissions_api_version}") { transitive = false }
    // Text Placeholder API: optional (%tradery:balance% etc.)
    modCompileOnly("eu.pb4:placeholder-api:${placeholder_api_version}") { transitive = false }

    // Dev only: run with the optional mods installed: ./gradlew :fabric:runClient -Pcompat=true
    if (project.hasProperty('compat')) {
        modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
        modRuntimeOnly("maven.modrinth:jade:${jade_fabric_version}")
        modRuntimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")
        modRuntimeOnly("dev.architectury:architectury-fabric:${architectury_version}")
        modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}")
        modRuntimeOnly("eu.pb4:placeholder-api:${placeholder_api_version}")
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// GameTests: shared bodies in common (dev.eliasnvx.tradery.gametest), @GameTest wrappers in src/gametest.
// runGameTest is part of `build`. 1.21.1 has no client GameTest API (Fabric added it for 1.21.4).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'tradery-test'
        enableGameTests = true
        enableClientGameTests = false
        eula = true // dev/CI test server only (as in the author's other mods)
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

apply from: rootProject.file('gradle/publish-mod.gradle')
