plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('build/run/gameTest')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // REI finds NeoForge plugins by an annotation that only its NeoForge jar has
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}") { transitive = false }

    // Dev only: run with the optional mods installed: ./gradlew :neoforge:runClient -Pcompat=true
    if (project.hasProperty('compat')) {
        runtimeOnly("mezz.jei:jei-26.3-neoforge:${jei_version}")
        runtimeOnly("maven.modrinth:jade:${jade_neoforge_version}")
        runtimeOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}")
        runtimeOnly("dev.architectury:architectury-neoforge:${architectury_version}")
        runtimeOnly("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")
    }
}

// `build` -> `check` -> GameTests on NeoForge too (Fabric wires runGameTest into build itself)
tasks.named('check') { dependsOn 'runGameTestServer' }

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

apply from: rootProject.file('gradle/publish-mod.gradle')
