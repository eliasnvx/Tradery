plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// The NeoForge counterpart of Fabric's client GameTests (NeoForge has no client test framework)
sourceSets {
    clientTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        tradery_client_test {
            sourceSet sourceSets.clientTest
        }
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
            // Runs load every mod in `mods` by default; the dev-only test mod only goes into its own runs below
            loadedMods = [mods."${mod_id}"]
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('build/run/gameTest')
        }
        // Dev only, needs a display: drives a client through quick trade and the hint, then quits.
        // ./gradlew :neoforge:runClientTest (screenshots in build/run/clientTest/screenshots)
        clientTest {
            client()
            sourceSet = sourceSets.clientTest
            loadedMods = [mods."${mod_id}", mods.tradery_client_test]
            gameDirectory = project.file('build/run/clientTest')
        }
        // Dev only: two launches with a kill -9 in between, driven by tools/crash-test.sh
        crashTest {
            server()
            sourceSet = sourceSets.clientTest
            loadedMods = [mods."${mod_id}", mods.tradery_client_test]
            gameDirectory = project.file('build/run/crashTest')
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.clientTest)
// -Pcompat=true puts the optional mods into the client test too
configurations.clientTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)

dependencies {
    // REI finds NeoForge plugins by an annotation that only its NeoForge jar has
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}") { transitive = false }

    // Dev only: run with the optional mods installed: ./gradlew :neoforge:runClient -Pcompat=true
    if (project.hasProperty('compat')) {
        runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false } // the full mod jar; its POM lists dev-only modules
        runtimeOnly("maven.modrinth:jade:${jade_neoforge_version}")
        runtimeOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}")
        runtimeOnly("dev.architectury:architectury-neoforge:${architectury_version}")
        runtimeOnly("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")
    }
}

// `build` -> `check` -> GameTests on NeoForge too (Fabric wires runGameTest into build itself)
tasks.named('check') { dependsOn 'runGameTestServer' }

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

apply from: rootProject.file('gradle/publish-mod.gradle')
