org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Gradle's HTTP resolution has no timeout by default: a stalled repository would hang the build forever.
systemProp.http.connectionTimeout=30000
systemProp.http.socketTimeout=30000
systemProp.https.connectionTimeout=30000
systemProp.https.socketTimeout=30000

# Mod
mod_id=tradery
mod_name=Tradery
mod_author=eliasnvx
description=Vending blocks, a virtual currency with an on-screen balance, coin ore and a public Economy API.
license=MIT
group=dev.eliasnvx
version=0.1.0
# Public API SemVer, independent of the mod version (SPEC "Economy API")
api_version=0.1.0
java_version=25

# Minecraft (versions checked against maven-metadata on 2026-09-30, see docs/decisions.md)
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
# Vanilla toolchain for :api and :common (https://projects.neoforged.net/neoforged/neoform)
neo_form_version=26.3-1

# Fabric
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.3

# NeoForge
neoforge_version=26.3.0.36-beta
neoforge_loader_version_range=[4,)

# Libraries
jetbrains_annotations_version=26.1.0
junit_version=6.1.3
