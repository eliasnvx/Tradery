org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Gradle's HTTP resolution has no timeout by default: a stalled repository would hang the build forever.
systemProp.http.connectionTimeout=30000
systemProp.http.socketTimeout=30000
systemProp.https.connectionTimeout=30000
systemProp.https.socketTimeout=30000

# Publishing: fill in after creating the projects (Modrinth: the 8-character project ID, not the slug;
# CurseForge: the numeric project ID, 0 = skip CurseForge)
modrinth_project_id=0
curseforge_project_id=0

# Mod
mod_id=tradery
mod_name=Tradery
mod_author=eliasnvx
description=Vending blocks, a virtual currency with an on-screen balance, coin ore and a public Economy API.
license=MIT
group=dev.eliasnvx
version=1.2.0
# Public API SemVer, independent of the mod version (SPEC "Economy API")
api_version=1.2.0
java_version=25

# Minecraft (versions checked against maven-metadata on 2026-09-30, see docs/decisions.md)
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
# Vanilla toolchain for :api and :common (https://projects.neoforged.net/neoforged/neoform)
neo_form_version=26.3-1

# Fabric
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.3

# NeoForge
neoforge_version=26.3.0.36-beta
neoforge_loader_version_range=[4,)

# Libraries
jetbrains_annotations_version=26.1.0
junit_version=6.1.3

# Integrations (checked 2026-09-30). Only Common Economy API ships inside the Fabric jar; the rest are optional.
common_economy_api_version=2.0.0
placeholder_api_version=3.2.0+26.3
jei_version=31.8.0.48
rei_version=26.3.823
# Compile-only, for REI's API types
cloth_config_version=26.3.159
architectury_version=22.0.3
jade_fabric_version=26.3.3+fabric
jade_neoforge_version=26.3.1+neoforge
# v1.2 integrations (checked against Modrinth and Maven Central on 2026-11-10). Compile-only APIs; the mods run in dev with -Pcompat=true
wthit_version=21.0.0
badpackets_version=0.12.3
bluemap_api_version=2.8.2
bluemap_version=5.29
flow_math_version=1.0.3
squaremap_version=1.4.3
# Modrinth version ids: squaremap's version number is the same on every loader
squaremap_fabric_id=YPMtDS9D
squaremap_neoforge_id=4EBVn9SQ
villagersplus_version=4.1.0+mc26.3
villagerstradingplus_version=1.1.0+mc26.3
ctov_fabric_version=4.2.2a
ctov_neoforge_version=4.2.2b
lithostitched_version=2.0.6
guard_villagers_version=5.0.0
