org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Gradle's HTTP resolution has no timeout by default: a stalled repository would hang the build forever.
systemProp.http.connectionTimeout=30000
systemProp.http.socketTimeout=30000
systemProp.https.connectionTimeout=30000
systemProp.https.socketTimeout=30000

# Publishing: fill in after creating the projects (Modrinth: the 8-character project ID, not the slug;
# CurseForge: the numeric project ID, 0 = skip CurseForge)
modrinth_project_id=0
curseforge_project_id=0

# Mod
mod_id=tradery
mod_name=Tradery
mod_author=eliasnvx
description=Vending blocks, a virtual currency with an on-screen balance, coin ore and a public Economy API.
license=MIT
group=dev.eliasnvx
version=1.0.0
# Public API SemVer, independent of the mod version (SPEC "Economy API")
api_version=1.0.0
java_version=21

# Minecraft (versions checked against maven-metadata on 2026-10-09, see docs/decisions.md)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.21.2)
# Vanilla toolchain for :api and :common (https://projects.neoforged.net/neoforged/neoform)
neo_form_version=1.21.1-20240808.144430

# Fabric
fabric_loader_version=0.19.5
# Lowest Fabric Loader the mod accepts (fabric.mod.json): what Fabric API 0.116.17+1.21.1 itself needs, checked with
# ./gradlew :fabric:runGameTest :fabric:runClientTest -Pfabric_loader_version=<this>
fabric_loader_min_version=0.15.11
fabric_api_version=0.116.17+1.21.1

# NeoForge
neoforge_version=21.1.256
neoforge_loader_version_range=[4,)

# Libraries
jetbrains_annotations_version=26.1.0
junit_version=6.1.3

# Integrations (checked 2026-09-30). Only Common Economy API ships inside the Fabric jar; the rest are optional.
# 1.21.1: Fabric API has no permission module, so the Fabric jar also ships lucko's fabric-permissions-api.
common_economy_api_version=1.2.0
fabric_permissions_api_version=0.3.1
placeholder_api_version=2.4.2+1.21
jei_version=19.57.0.451
# JEI's config library: nested in the JEI jar, but dev runs need it on the classpath
mezz_config_version=0.5.12
rei_version=16.0.799
# Compile-only, for REI's API types
cloth_config_version=15.0.140
architectury_version=13.0.11
jade_fabric_version=15.10.6+fabric
jade_neoforge_version=15.10.6+neoforge
