org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Gradle's HTTP resolution has no timeout by default: a stalled repository would hang the build forever.
systemProp.http.connectionTimeout=30000
systemProp.http.socketTimeout=30000
systemProp.https.connectionTimeout=30000
systemProp.https.socketTimeout=30000

# Publishing: fill in after creating the projects (Modrinth: the 8-character project ID, not the slug;
# CurseForge: the numeric project ID, 0 = skip CurseForge)
modrinth_project_id=0
curseforge_project_id=0

# Mod
mod_id=tradery
mod_name=Tradery
mod_author=eliasnvx
description=Vending blocks, a virtual currency with an on-screen balance, coin ore and a public Economy API.
license=MIT
group=dev.eliasnvx
version=1.0.0
# Public API SemVer, independent of the mod version (SPEC "Economy API")
api_version=1.0.0
java_version=17

# Minecraft (versions checked against maven-metadata on 2026-10-09, see docs/decisions.md)
minecraft_version=1.20.1
minecraft_version_range=[1.20.1, 1.20.2)

# Fabric
fabric_loader_version=0.19.5
fabric_api_version=0.92.12+1.20.1

# Forge (MDG legacyforge; :api and :common compile against vanilla through MCP)
forge_version=47.4.26
forge_loader_version_range=[47,)

# Libraries
jetbrains_annotations_version=26.1.0
junit_version=6.1.3

# Integrations (checked 2026-09-30). Only Common Economy API ships inside the Fabric jar; the rest are optional.
# 1.20.1: Fabric API has no permission module, so the Fabric jar also ships lucko's fabric-permissions-api.
# Common Economy API 1.2.x needs Minecraft 1.20.5+ and Java 21; 1.1.1 has the same API and runs on 1.20.1 (checked
# against the 1.20.1 intermediary mappings)
common_economy_api_version=1.1.1
fabric_permissions_api_version=0.3.1
placeholder_api_version=2.1.4+1.20.1
jei_version=15.62.0.219
rei_version=12.1.785
# Compile-only, for REI's API types
cloth_config_version=11.1.136
architectury_version=9.2.14
jade_fabric_version=11.13.3+fabric
jade_forge_version=11.13.3+forge
