// All loader-agnostic logic. Compiled against vanilla Minecraft; loader APIs are reached through Platform.
plugins {
    id 'multiloader-shared'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    // JUnit tests use vanilla classes (ResourceLocation, Codec, Gson) too
    addModdingDependenciesTo(sourceSets.test)
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    implementation project(':api')

    // Optional integrations (compile only). JEI's common API is Mojang-named; REI, Cloth, Architectury and Jade ship
    // SRG-named Forge jars, which legacyforge remaps to Mojang names (modCompileOnly)
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}") { transitive = false }
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-forge:${rei_version}") { transitive = false }
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-forge:${rei_version}") { transitive = false }
    // REI's API signatures mention these (Rectangle, FluidStack)
    modCompileOnly("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}") { transitive = false }
    compileOnly("me.shedaniel.cloth:basic-math:0.6.1") { transitive = false }
    modCompileOnly("dev.architectury:architectury-forge:${architectury_version}") { transitive = false }
    modCompileOnly("maven.modrinth:jade:${jade_forge_version}") { transitive = false }

    // Both loaders ship Mixin; Forge resolves the mixins through the refmap the :forge build generates
    // Forge 47 ships plain Mixin 0.8.5 and no MixinExtras: common mixins use plain Mixin only
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

// TraderyApi.API_VERSION must match api_version (ApiVersionTest); the lang test scans the sources
tasks.named('test') {
    systemProperty 'tradery.apiVersion', api_version
    systemProperty 'tradery.sources', file('src/main/java').absolutePath
}

// The mod never publishes :common on its own
tasks.withType(PublishToMavenRepository).configureEach { enabled = false }
