// All loader-agnostic logic. Compiled against vanilla Minecraft; loader APIs are reached through Platform.
plugins {
    id 'multiloader-shared'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // JUnit tests use vanilla classes (Identifier, Codec, Gson) too
    addModdingDependenciesTo(sourceSets.test)
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    implementation project(':api')

    // Both loaders ship Fabric Mixin and MixinExtras, so common mixins can use them
    // https://github.com/neoforged/NeoForge/blob/26.3.x/gradle.properties
    compileOnly 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))
}

// TraderyApi.API_VERSION must match api_version (ApiVersionTest); the lang test scans the sources
tasks.named('test') {
    systemProperty 'tradery.apiVersion', api_version
    systemProperty 'tradery.sources', file('src/main/java').absolutePath
}

// The mod never publishes :common on its own
tasks.withType(PublishToMavenRepository).configureEach { enabled = false }
